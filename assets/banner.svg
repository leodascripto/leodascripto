<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" role="img" aria-label="Leo Oli: engenheiro de software, cofundador da Trinca, instrutor de cripto, open source">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1c1a10"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6d00"/>
      <stop offset="0.5" stop-color="#ffd700"/>
      <stop offset="1" stop-color="#8a6d00"/>
    </linearGradient>
    <clipPath id="frame"><rect width="900" height="180" rx="14"/></clipPath>
  </defs>
  <style>
    .name { font: 700 54px 'Segoe UI', Arial, sans-serif; fill: #ffd700; letter-spacing: 1px; }
    .role { font: 500 24px Consolas, 'Courier New', monospace; fill: #e6edf3; opacity: 0; }
    .prompt { font: 500 24px Consolas, 'Courier New', monospace; fill: #ffd700; }
    .r1 { animation: show 12s infinite; animation-delay: 0s; }
    .r2 { animation: show 12s infinite; animation-delay: 3s; }
    .r3 { animation: show 12s infinite; animation-delay: 6s; }
    .r4 { animation: show 12s infinite; animation-delay: 9s; }
    @keyframes show {
      0%   { opacity: 0; transform: translateX(-14px); }
      4%   { opacity: 1; transform: translateX(0); }
      21%  { opacity: 1; transform: translateX(0); }
      25%  { opacity: 0; transform: translateX(10px); }
      100% { opacity: 0; transform: translateX(10px); }
    }
    .cursor { animation: blink 1s steps(1) infinite; fill: #ffd700; }
    @keyframes blink { 50% { opacity: 0; } }
    .glow { opacity: .15; animation: glow 4s ease-in-out infinite both; }
    @keyframes glow { 0%,100% { opacity: .10; } 50% { opacity: .26; } }
    .scan { animation: scan 6s linear infinite; }
    @keyframes scan { from { transform: translateX(-300px); } to { transform: translateX(900px); } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="900" height="180" fill="url(#bg)"/>
    <circle class="glow" cx="800" cy="30" r="90" fill="#ffd700"/>
    <circle class="glow" cx="60" cy="185" r="60" fill="#ffd700" style="animation-delay:2s"/>
    <rect x="0" y="168" width="900" height="2" fill="#ffd700" opacity=".25"/>
    <rect class="scan" x="0" y="167" width="300" height="4" fill="url(#gold)"/>
  </g>
  <text class="name" x="40" y="82">Leo Oli</text>
  <text class="prompt" x="42" y="132">&gt;</text>
  <g transform="translate(72 0)">
    <text class="role r1" x="0" y="132">engenheiro de software</text>
    <text class="role r2" x="0" y="132">cofundador da Trinca</text>
    <text class="role r3" x="0" y="132">instrutor de cripto</text>
    <text class="role r4" x="0" y="132">contribuo com open source</text>
  </g>
</svg>
